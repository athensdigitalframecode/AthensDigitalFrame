<form class="lead-form" id="leadform" novalidate>
      <div class="lf-row"><label for="lf-n" data-el="Όνομα" data-en="Name">Όνομα</label><input id="lf-n" name="n" autocomplete="name" required maxlength="60"></div>
      <div class="lf-row"><label for="lf-b" data-el="Τι επιχείρηση έχεις;" data-en="What kind of business?">Τι επιχείρηση έχεις;</label><input id="lf-b" name="b" autocomplete="organization" maxlength="80" placeholder="" data-pel="π.χ. οδοντίατρος" data-pen="e.g. dentist"></div>
      <div class="lf-row"><label for="lf-p" data-el="Τηλέφωνο" data-en="Phone">Τηλέφωνο</label><input id="lf-p" name="p" type="tel" inputmode="tel" autocomplete="tel" required maxlength="24"></div>
      <p class="lf-err" id="lf-err" role="alert" hidden></p>
      <div class="lf-act"><button class="btn" type="submit" id="lf-wa" data-el="Στείλε στο WhatsApp" data-en="Send via WhatsApp">Στείλε στο WhatsApp</button><button class="btn ghost" type="button" id="lf-mail" data-el="Ή με email" data-en="Or by email">Ή με email</button></div>
    </form>
